<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta http-equiv='refresh' content='300'><meta name='viewport' content='width=800'><title>Kindle Dashboard</title><style>html,body{margin:0;padding:0;background:#fff;color:#000;font-family:Futura,'Century Gothic','Trebuchet MS',Helvetica,Arial,sans-serif}body{position:relative;width:800px;height:600px;overflow:hidden}.wrap{padding:14px 16px 0 16px}.top{height:34px;border-bottom:2px solid #000;overflow:hidden}.top .t{float:left;font-size:24px;font-weight:bold;letter-spacing:1px;line-height:30px}.top .t small{font-size:12px;letter-spacing:2px;margin-left:4px}.top .d{float:right;font-size:13px;letter-spacing:3px;text-transform:uppercase;line-height:30px}.cols{margin-top:12px;overflow:hidden}.col{float:left;margin-right:12px}.c1{width:240px}.c2{width:252px}.c3{width:252px;margin-right:0}.h{font-family:'Courier New',Courier,monospace;font-size:13px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;padding-bottom:6px;border-bottom:1px solid #000;overflow:hidden}.h .n{float:right;border:2px solid #000;border-radius:10px;padding:0 6px;font-size:12px;letter-spacing:0;line-height:14px}.m{padding:8px 0;border-bottom:1px dashed #000;overflow:hidden}.m .tm{font-size:22px;font-weight:bold;line-height:24px}.m .tm small{font-family:'Courier New',Courier,monospace;font-size:11px;margin-left:8px;letter-spacing:1px;text-transform:uppercase}.m .ti{font-size:15px;line-height:19px;margin-top:2px}.m.now{background:#000;color:#fff;border-radius:12px;padding:9px 13px;margin:10px 0 2px 0;border-bottom:none}.m.now .lbl{font-family:'Courier New',Courier,monospace;font-size:10px;letter-spacing:3px;font-weight:bold}.k{padding:7px 0;border-bottom:1px dashed #000;overflow:hidden;font-size:14px;line-height:18px}.o{float:left;width:10px;height:10px;border:2px solid #000;border-radius:7px;margin-top:2px}.kt{display:block;margin-left:24px}.pill{font-family:'Courier New',Courier,monospace;font-size:10px;font-weight:bold;border:1px solid #000;border-radius:8px;padding:0 5px;margin-left:4px;letter-spacing:1px;white-space:nowrap}.late{background:#000;color:#fff}.none{padding:10px 0;font-size:14px;font-style:italic}.q{position:absolute;left:16px;right:16px;top:486px;height:66px;border:2px solid #000;border-radius:14px;text-align:center}.q .qt{font-size:18px;line-height:24px;font-style:italic;padding-top:10px}.q .qa{font-family:'Courier New',Courier,monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;margin-top:5px}.ft{position:absolute;left:16px;right:16px;top:572px;height:16px;font-family:'Courier New',Courier,monospace;font-size:10px;letter-spacing:3px;text-align:center;text-transform:uppercase}</style></head><body><div class='wrap'><div class='top'><div class='t' id='time'>--:--</div><div class='d' id='date'></div></div><div class='cols'><div class='col c1'><div class='h'>01 Meetings <span class='n' id='n1'>0</span></div><div id='l1'><div class='none'>Loading...</div></div></div><div class='col c2'><div class='h'>02 Work <span class='n' id='n2'>0</span></div><div id='l2'></div></div><div class='col c3'><div class='h'>03 Personal <span class='n' id='n3'>0</span></div><div id='l3'></div></div></div></div><div class='q'><div class='qt'>&ldquo;Slow is smooth, and smooth is fast.&rdquo;</div><div class='qa'>Proverb</div></div><div class='ft'>Refreshes every 5 min &middot; updated <span id='upd'>--:--</span></div><script>(function(){var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];function el(i){return document.getElementById(i);}function pad(n){return n<10?'0'+n:''+n;}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}function ist(){var d=new Date();return new Date(d.getTime()+(330+d.getTimezoneOffset())*60000);}function stamp(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}function txt(p){var a=(p&&(p.title||p.rich_text))||[],s='',i;for(i=0;i<a.length;i++){s+=a[i].plain_text||'';}return s;}function sel(p){return p&&p.select?p.select.name:'';}function parse(w){if(!w||w.length<10)return null;var y=+w.substr(0,4),mo=+w.substr(5,2),dd=+w.substr(8,2);if(!y||!mo||!dd)return null;var d=new Date(Date.UTC(y,mo-1,dd));return {day:DAYS[d.getUTCDay()],dm:dd+' '+MON[mo-1],hm:w.length>=16?w.substr(11,5):'',date:w.substr(0,10)};}function clock(){var d=ist(),h=d.getHours(),ap=h>=12?'PM':'AM',h12=h%12;if(h12===0)h12=12;el('time').innerHTML=h12+':'+pad(d.getMinutes())+'<small>'+ap+'</small>';el('date').innerHTML=DAYS[d.getDay()]+' &middot; '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();el('upd').innerHTML=pad(h)+':'+pad(d.getMinutes());}function row(x,now,today){var q=parse(x.w),pill='';if(q){if(x.w<now&&x.w.substr(0,10)<=today){pill=' <span class="pill late">LATE</span>';}else if(q.date===today){pill=' <span class="pill">'+(q.hm||'TODAY')+'</span>';}else{pill=' <span class="pill">'+q.dm+'</span>';}}return '<div class="k"><span class="o"></span><span class="kt">'+esc(x.t)+pill+'</span></div>';}function fill(id,nid,list,now,today,max){var h='',i;for(i=0;i<list.length&&i<max;i++){h+=row(list[i],now,today);}if(!list.length){h='<div class="none">Nothing pending</div>';}else if(list.length>max){h+='<div class="none">+'+(list.length-max)+' more</div>';}el(id).innerHTML=h;el(nid).innerHTML=list.length;}function render(data){var res=data.results||[],items=[],i,p,t;for(i=0;i<res.length;i++){p=res[i].properties||{};t=txt(p['Task/Meeting']);if(!t)continue;items.push({t:t,type:sel(p['Type']),cat:sel(p['Category']),w:txt(p['Date & Time'])});}items.sort(function(a,b){if(a.w&&b.w)return a.w<b.w?-1:(a.w>b.w?1:0);if(a.w)return -1;if(b.w)return 1;return 0;});var now=stamp(ist()),today=now.substr(0,10),M=[],W=[],P=[];for(i=0;i<items.length;i++){if(items[i].type==='Meeting'){if(!items[i].w||items[i].w.substr(0,10)>=today)M.push(items[i]);}else if(items[i].cat==='Work'){W.push(items[i]);}else{P.push(items[i]);}}var h='',first=true,q,up,lab;for(i=0;i<M.length&&i<5;i++){q=parse(M[i].w);up=first&&M[i].w>=now;if(up)first=false;lab=q?(q.date===today?'Today':q.day+' '+q.dm):'No date';h+='<div class="m'+(up?' now':'')+'">'+(up?'<div class="lbl">UP NEXT</div>':'')+'<div class="tm">'+((q&&q.hm)||'--:--')+'<small>'+lab+'</small></div><div class="ti">'+esc(M[i].t)+'</div></div>';}if(!M.length){h='<div class="none">No meetings</div>';}el('l1').innerHTML=h;el('n1').innerHTML=M.length;fill('l2','n2',W,now,today,7);fill('l3','n3',P,now,today,7);}function load(){var x=window.XMLHttpRequest?new XMLHttpRequest():null;if(!x)return;x.onreadystatechange=function(){var j;if(x.readyState!==4)return;if(x.status===200){try{j=JSON.parse(x.responseText);}catch(e){j=null;}if(j)render(j);}};x.open('GET','data.json?t='+(new Date().getTime()),true);x.send(null);}clock();load();})();</script></body></html>
